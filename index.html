<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A3A5C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Mein Plan MoGeRe Gold</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
/* Mein Plan MoGeRe Gold */
:root {
  --navy: #1A3A5C;
  --navy-deep: #12293F;
  --gold: #C8972A;
  --gold-soft: #F2E3C2;
  --bg: #EEF1F5;
  --card: #ffffff;
  --line: #D8DEE6;
  --ink: #1c2733;
  --dim: #6b7684;
  --green: #15803d;
  --red: #b91c1c;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--bg); color: var(--ink);
  overscroll-behavior-y: none;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea {
  font-family: inherit; font-size: 16px; color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 10px; background: #fff; width: 100%;
}
input:focus, select:focus, textarea:focus, button:focus-visible {
  outline: 2px solid var(--gold); outline-offset: 1px;
}
a { color: var(--navy); }

.app-root { display: flex; flex-direction: column; min-height: 100dvh; }

/* ---------- Kopfzeile ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
  color: #fff;
  padding: calc(8px + var(--safe-t)) 10px 8px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  border-bottom: 3px solid var(--gold);
}
.brand { font-size: 16px; font-weight: 800; white-space: nowrap; }
.brand-gold { color: var(--gold); }
.sub-line { font-size: 12px; color: #c8d4e0; font-weight: 700; margin-top: 1px; }
.topbar-actions { display: flex; gap: 2px; flex-shrink: 0; }
.icon-btn {
  background: transparent; border: none; color: inherit;
  min-width: 42px; min-height: 42px; border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn:active { background: rgba(255,255,255,0.15); }
.icon-btn.navy { color: var(--navy); }
.icon-btn.navy:disabled { opacity: 0.3; }
.icon-btn.navy:active { background: rgba(26,58,92,0.1); }
.icon-btn.small { min-width: 36px; min-height: 36px; }
.icon-btn.danger { color: var(--red); }
.sheet .icon-btn:active { background: rgba(0,0,0,0.07); }

.content { flex: 1; padding-bottom: calc(72px + var(--safe-b)); }

/* ---------- Onboarding ---------- */
.onboard { max-width: 420px; margin: 10dvh auto 0; padding: 0 22px; text-align: center; }
.ob-logo {
  width: 74px; height: 74px; margin: 0 auto 16px; border-radius: 20px;
  background: linear-gradient(160deg, var(--navy), var(--navy-deep));
  border: 3px solid var(--gold);
  color: var(--gold); font-size: 26px; font-weight: 900;
  display: flex; align-items: center; justify-content: center; letter-spacing: 0.03em;
}
.ob-title { font-size: 19px; font-weight: 800; color: var(--navy); margin-bottom: 10px; }
.ob-text { font-size: 14px; color: var(--dim); line-height: 1.6; margin-bottom: 20px; }

/* ---------- Wochen-Kopf ---------- */
.week-head {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: 10px 10px 6px;
}
.wh-mid { text-align: center; min-width: 0; }
.wh-kw { font-size: 16.5px; font-weight: 800; color: var(--navy); }
.wh-range { font-size: 11.5px; color: var(--dim); font-weight: 600; margin-top: 1px; }
.week-note {
  display: flex; align-items: flex-start; gap: 7px;
  margin: 2px 14px 6px; padding: 8px 11px;
  background: #fdf6e5; border: 1px solid #ecd9a8; border-radius: 10px;
  font-size: 12.5px; color: #6d4f0e; font-weight: 600;
}

/* ---------- Tages-Strip ---------- */
.day-strip {
  display: flex; gap: 5px; overflow-x: auto; padding: 6px 12px 8px;
  scrollbar-width: none;
}
.day-strip::-webkit-scrollbar { display: none; }
.day-chip {
  flex: 1 0 52px; min-height: 62px;
  border: 1.5px solid var(--line); border-radius: 12px; background: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  color: var(--ink); padding: 5px 0;
}
.day-chip .wd { font-size: 10.5px; font-weight: 700; color: var(--dim); text-transform: uppercase; }
.day-chip .dn { font-size: 17px; font-weight: 800; line-height: 1.1; }
.day-chip .cnt {
  font-size: 10px; font-weight: 800; color: var(--dim);
  background: #eef1f5; border-radius: 99px; padding: 0 6px; margin-top: 1px; min-width: 18px;
}
.day-chip .cnt.alldone { background: #dcfce7; color: var(--green); }
.day-chip.holiday { border-color: #ef4444; }
.day-chip.holiday .wd { color: #dc2626; }
.day-chip.today { box-shadow: inset 0 0 0 2px var(--gold); }
.day-chip.sel { background: var(--navy); border-color: var(--navy); color: #fff; }
.day-chip.sel .wd { color: var(--gold-soft); }
.day-chip.sel .cnt { background: rgba(255,255,255,0.2); color: #fff; }
.day-chip.sel .cnt.alldone { background: #2f9e58; }

/* ---------- Aufgabenliste ---------- */
.day-view { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.day-view.compact { padding: 4px 12px 14px; }
.day-holiday {
  background: #fee2e2; border: 1px solid #fca5a5; border-radius: 10px;
  color: #b91c1c; font-size: 12.5px; font-weight: 800; text-align: center; padding: 6px;
}
.day-note {
  display: flex; align-items: flex-start; gap: 6px;
  background: #fdf6e5; border: 1px solid #ecd9a8; border-radius: 10px;
  font-size: 12.5px; color: #6d4f0e; font-weight: 600; padding: 7px 10px;
}
.empty-state { color: var(--dim); font-size: 13.5px; padding: 18px 8px; text-align: center; }

.task {
  display: flex; gap: 2px;
  background: var(--card); border: 1.5px solid var(--line);
  border-left-width: 6px; border-radius: 12px;
  overflow: hidden;
}
.task.done { opacity: 0.62; background: #f6f8f6; }
.task-check {
  flex: 0 0 50px; background: none; border: none;
  display: flex; align-items: flex-start; justify-content: center; padding-top: 13px;
}
.cbox {
  width: 26px; height: 26px; border: 2px solid #b9c3cf; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 900; color: #fff; background: #fff;
}
.cbox.on { background: var(--green); border-color: var(--green); }
.task-body { flex: 1; padding: 10px 12px 10px 0; min-width: 0; }
.task-top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.task-time { font-size: 14.5px; font-weight: 800; color: var(--navy); }
.task-typ {
  font-size: 11px; font-weight: 800; border-radius: 6px; padding: 2px 7px;
}
.task-e { font-size: 11.5px; font-weight: 700; color: #0d9488; }
.task-patient { font-size: 15px; font-weight: 700; margin-top: 3px; }
.task.done .task-patient { text-decoration: line-through; }
.task-notiz {
  background: #fdf6e5; border: 1px solid #ecd9a8; border-radius: 8px;
  font-size: 12.5px; color: #6d4f0e; padding: 5px 8px; margin-top: 6px; white-space: pre-wrap;
}
.task-links { display: flex; flex-direction: column; gap: 4px; margin-top: 7px; }
.task-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 600; color: var(--navy);
  text-decoration: none; padding: 6px 9px;
  background: #f0f4f8; border: 1px solid #d6e0ea; border-radius: 8px;
  min-height: 34px; width: fit-content; max-width: 100%;
}
.task-link.tel { color: #0d6c56; background: #ecf8f4; border-color: #bfe5d9; }

/* ---------- Wochenliste ---------- */
.week-list { padding: 2px 0 8px; }
.wl-day {
  display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; font-weight: 800; color: var(--navy);
  padding: 10px 14px 2px;
}
.wl-day.today::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
.wl-cnt { margin-left: auto; font-size: 11.5px; color: var(--dim); font-weight: 700; }
.holiday-tag {
  font-size: 10.5px; font-weight: 800; color: #dc2626;
  background: #fee2e2; border: 1px solid #fca5a5; padding: 1px 7px; border-radius: 99px;
}

/* ---------- Untere Navigation ---------- */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--card); border-top: 1px solid var(--line);
  display: flex; padding-bottom: var(--safe-b); justify-content: center;
}
.bottom-nav button {
  flex: 0 1 190px; background: none; border: none; color: var(--dim);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 11px; font-weight: 700; padding: 8px 0 7px; min-height: 56px;
  border-top: 3px solid transparent;
}
.bottom-nav button.active { color: var(--navy); border-top-color: var(--gold); }

/* ---------- Sheets ---------- */
.sheet-backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(16, 26, 38, 0.45);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn 0.15s ease;
}
.sheet {
  background: var(--bg); width: 100%; max-width: 560px;
  border-radius: 18px 18px 0 0; max-height: 88dvh;
  display: flex; flex-direction: column;
  animation: slideUp 0.18s ease;
}
.sheet.tall { height: 88dvh; }
.sheet-header {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 8px 8px 16px; border-bottom: 1px solid var(--line);
  background: var(--card); border-radius: 18px 18px 0 0; flex-shrink: 0;
}
.sheet-title { font-size: 15.5px; font-weight: 800; color: var(--navy); flex: 1; }
.sheet-body { overflow-y: auto; padding: 14px 16px calc(18px + var(--safe-b)); }
@keyframes slideUp { from { transform: translateY(40px); opacity: 0.6; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet, .sheet-backdrop { animation: none; } }

.menu-list { display: flex; flex-direction: column; gap: 8px; }
.menu-list button {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  font-size: 14.5px; font-weight: 600; color: var(--ink);
  padding: 13px 14px; min-height: 50px; text-align: left;
}
.menu-sub { font-size: 11.5px; font-weight: 800; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; margin: 16px 0 7px; }
.week-manage { display: flex; flex-direction: column; gap: 6px; }
.wm-item {
  display: flex; align-items: center; gap: 6px;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 6px 4px 0;
}
.wm-open { flex: 1; background: none; border: none; text-align: left; font-size: 14px; font-weight: 700; color: var(--navy); padding: 9px 12px; display: flex; align-items: center; gap: 8px; }
.wm-src { font-size: 10.5px; font-weight: 700; color: var(--dim); background: #eef1f5; border-radius: 99px; padding: 1px 8px; }
.menu-hint { font-size: 12px; color: var(--dim); margin-top: 14px; line-height: 1.55; padding: 0 2px; }
.mt14 { margin-top: 14px; }
.mt6 { margin-top: 6px; }

.mini-btn {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 700; color: var(--ink);
  background: #fff; border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 11px; min-height: 36px;
}
.mini-btn.danger { color: var(--red); border-color: #f3c1c1; }
.mini-btn.navy { background: var(--navy); border-color: var(--navy); color: #fff; }
.primary-btn {
  width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--navy); color: #fff; border: none; border-radius: 10px;
  font-size: 14.5px; font-weight: 700; padding: 12px; min-height: 46px;
}
.primary-btn:active { background: var(--navy-deep); }
.primary-btn.small { width: auto; padding: 10px 14px; min-height: 42px; font-size: 13px; }

/* eingehender Plan */
.in-box { background: var(--card); border: 1.5px solid var(--gold); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.in-name { font-size: 16px; font-weight: 800; color: var(--navy); }
.in-meta { font-size: 12.5px; color: var(--dim); font-weight: 600; margin-top: 3px; }
.in-warn {
  background: #fee2e2; border: 1px solid #fca5a5; border-radius: 10px;
  color: #b91c1c; font-size: 12.5px; font-weight: 700; padding: 9px 11px; margin-bottom: 12px;
}
.in-error { color: var(--red); font-size: 13.5px; font-weight: 600; padding: 8px 2px; }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: calc(78px + var(--safe-b)); transform: translateX(-50%);
  background: var(--navy-deep); color: #fff; font-size: 13px; font-weight: 600;
  padding: 9px 16px; border-radius: 99px; z-index: 90;
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  border-left: 3px solid var(--gold);
  max-width: 92vw; text-align: center;
}

/* ---------- Verteiler ---------- */
.verteiler { padding: 12px 14px calc(20px + var(--safe-b)); }
.vt-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.vt-title { display: inline-flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 800; color: var(--navy); }
.vt-step { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 13px; margin-bottom: 10px; }
.vt-step-title { font-size: 12px; font-weight: 800; color: var(--gold); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 9px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.vt-all { margin-left: auto; text-transform: none; letter-spacing: 0; }
.vt-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.vt-loaded { font-size: 12.5px; font-weight: 700; color: var(--navy); }
.vt-loaded.ok { color: var(--green); }
.vt-weeks { display: flex; gap: 6px; flex-wrap: wrap; }
.week-pill {
  border: 1.5px solid var(--line); background: #fff; color: var(--ink);
  border-radius: 99px; font-size: 13px; font-weight: 700; padding: 8px 14px; min-height: 38px;
}
.week-pill.sel { background: var(--navy); border-color: var(--navy); color: #fff; }
.vt-list { display: flex; flex-direction: column; gap: 9px; }
.vt-item { border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px; background: #fbfcfe; }
.vt-name { font-size: 14.5px; font-weight: 800; color: var(--navy); }
.vt-meta { font-size: 11.5px; color: var(--dim); font-weight: 600; margin-top: 1px; }
.vt-days { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0; }
.vt-day {
  font-size: 10.5px; font-weight: 700; color: #b9c3cf;
  background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px;
}
.vt-day.has { color: var(--navy); border-color: #b9cbdd; background: #eef4fa; }
.vt-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.vt-link {
  margin-top: 8px; font-size: 10px; color: var(--dim);
  word-break: break-all; background: #fff; border: 1px dashed var(--line);
  border-radius: 8px; padding: 6px 8px; max-height: 64px; overflow: hidden;
}

/* ---------- Tablet ---------- */
@media (min-width: 768px) {
  .sheet-backdrop { align-items: center; padding: 24px; }
  .sheet { border-radius: 18px; }
  .sheet.tall { height: auto; max-height: 90dvh; }
  .sheet-header { border-radius: 18px 18px 0 0; }
  .day-view, .week-list, .day-strip, .week-head, .week-note { max-width: 720px; margin-left: auto; margin-right: auto; }
  .verteiler { max-width: 860px; margin: 0 auto; }
  .vt-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .onboard { margin-top: 14dvh; }
}

/* QR */
.qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 0 4px; }
.qr-canvas { width: min(88vw, 440px); height: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.qr-caption { font-size: 12.5px; font-weight: 600; color: var(--dim); text-align: center; }
.ob-qr { margin-top: 10px; }

/* Vorschau a Verteilerben */
.pv-meta { font-size: 12px; color: var(--dim); font-weight: 600; margin-bottom: 8px; }
.pv-week .day-view { padding-left: 0; padding-right: 0; }
.pv-week .wl-day { padding-left: 2px; padding-right: 2px; }
.task-check.ro { display: flex; align-items: flex-start; justify-content: center; padding-top: 16px; }
.rodot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.15); }

/* Mittagspause sor */
.pause-row {
  display: flex; align-items: center; gap: 8px;
  background: #fdf6e5; border: 1.5px dashed #d9bd7d; border-radius: 10px;
  color: #7a5a10; padding: 8px 13px; margin: 0 0 0 0;
}
.pause-label { font-size: 13px; font-weight: 800; }
.pause-time { font-size: 13px; font-weight: 700; margin-left: auto; }

/* Auto lablec a nap vegen */
.auto-row {
  display: flex; align-items: center; gap: 9px;
  border-radius: 10px; padding: 9px 13px; font-size: 12.5px; font-weight: 700;
  border: 1.5px solid;
}
.auto-row.heim { background: #ecfdf3; border-color: #86dfa9; color: #15803d; }
.auto-row.standort { background: #eef3f8; border-color: #b9cbdd; color: var(--navy); }
.auto-row .mg-mini { width: 20px; height: 20px; object-fit: contain; }

  </style>
</head>

<div id="root"></div>
